name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: ./tests/run.sh

  quality:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install ruff==0.16.1

      - name: Check shell scripts
        run: |
          bash -n install.sh tests/run.sh
          shellcheck --severity=warning install.sh tests/run.sh

      - name: Check critical Python rules
        run: |
          python -m compileall -q opslint.py tools
          ruff check --select E9,F63,F7,F82 opslint.py tools

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
